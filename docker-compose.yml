services:
  postgres:
    image: postgres:16-alpine
    container_name: smex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smex_store
    ports:
      - "5432:5432"
    volumes:
      - smex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smex_store"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smex-network

  redis:
    image: redis:7.2-alpine
    container_name: smex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - smex_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smex-network

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: smex-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - smex_minio_data:/data
    networks:
      - smex-network

volumes:
  smex_postgres_data:
  smex_redis_data:
  smex_minio_data:

networks:
  smex-network:
    driver: bridge
