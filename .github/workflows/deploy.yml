name: Continuous Deployment

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository }}/server
  CLIENT_IMAGE: ghcr.io/${{ github.repository }}/client

jobs:
  deploy:
    name: Build, Publish & Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Server Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
            ${{ env.SERVER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Client Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: client/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL }}
          tags: |
            ${{ env.CLIENT_IMAGE }}:${{ github.sha }}
            ${{ env.CLIENT_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Remote Rolling Deployment
        id: trigger_deploy
        run: |
          echo "Initiating rolling deployment for commit ${{ github.sha }}..."
          if [ -n "${{ secrets.PRODUCTION_DEPLOY_WEBHOOK }}" ]; then
            echo "Dispatching deployment webhook..."
            HTTP_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.PRODUCTION_DEPLOY_WEBHOOK }}" \
              -H "Content-Type: application/json" \
              -d "{\"sha\":\"${{ github.sha }}\",\"server_image\":\"${{ env.SERVER_IMAGE }}:${{ github.sha }}\",\"client_image\":\"${{ env.CLIENT_IMAGE }}:${{ github.sha }}\"}")
            if [ "$HTTP_RESPONSE" -ge 200 ] && [ "$HTTP_RESPONSE" -lt 300 ]; then
              echo "Deployment trigger acknowledged with HTTP $HTTP_RESPONSE."
            else
              echo "Deployment webhook failed with HTTP $HTTP_RESPONSE."
              exit 1
            fi
          elif [ -n "${{ secrets.SSH_HOST }}" ]; then
            echo "Deploying via SSH remote runner..."
            mkdir -p ~/.ssh
            echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519

            DEPLOY_DIR="${{ secrets.SSH_DEPLOY_DIR || '/opt/smex-store' }}"
            ENV_VARS="CLIENT_IMAGE=${{ env.CLIENT_IMAGE }}:${{ github.sha }} SERVER_IMAGE=${{ env.SERVER_IMAGE }}:${{ github.sha }}"
            COMPOSE="docker compose -f docker-compose.prod.yml"

            # set -e: stop the deploy if any step (especially migrations) fails
            echo "${{ secrets.GITHUB_TOKEN }}" | ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "set -e
               docker login ghcr.io -u ${{ github.actor }} --password-stdin
               cd $DEPLOY_DIR
               echo '[deploy] Pruning old unused docker images to reclaim disk space...'
               docker image prune -af || true
               $ENV_VARS $COMPOSE pull client server
               echo '[deploy] Running database migrations...'
               $ENV_VARS $COMPOSE up -d postgres redis
               $ENV_VARS $COMPOSE run --rm --no-deps server node dist/migrate.mjs
               echo '[deploy] Migrations OK. Restarting app...'
               $ENV_VARS $COMPOSE up -d --remove-orphans client server
               $COMPOSE exec -T nginx nginx -s reload 2>/dev/null || true
               docker image prune -f || true"
            echo "Deployment completed successfully on remote server."
          else
            echo "Notice: PRODUCTION_DEPLOY_WEBHOOK or SSH_HOST not configured. Container images published to GHCR. Manual deployment pull required on target host."
          fi
