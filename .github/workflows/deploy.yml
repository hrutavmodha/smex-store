name: Continuous Deployment & Rollback

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository }}/server
  CLIENT_IMAGE: ghcr.io/${{ github.repository }}/client

jobs:
  deploy:
    name: Build, Publish, Deploy & Healthcheck
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Server Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
            ${{ env.SERVER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Client Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: client/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL }}
          tags: |
            ${{ env.CLIENT_IMAGE }}:${{ github.sha }}
            ${{ env.CLIENT_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Remote Rolling Deployment
        id: trigger_deploy
        run: |
          echo "Initiating rolling deployment for commit ${{ github.sha }}..."
          if [ -n "${{ secrets.PRODUCTION_DEPLOY_WEBHOOK }}" ]; then
            echo "Dispatching deployment webhook..."
            HTTP_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.PRODUCTION_DEPLOY_WEBHOOK }}" \
              -H "Content-Type: application/json" \
              -d "{\"sha\":\"${{ github.sha }}\",\"server_image\":\"${{ env.SERVER_IMAGE }}:${{ github.sha }}\",\"client_image\":\"${{ env.CLIENT_IMAGE }}:${{ github.sha }}\"}")
            if [ "$HTTP_RESPONSE" -ge 200 ] && [ "$HTTP_RESPONSE" -lt 300 ]; then
              echo "Deployment trigger acknowledged with HTTP $HTTP_RESPONSE."
            else
              echo "Deployment webhook failed with HTTP $HTTP_RESPONSE."
              exit 1
            fi
          elif [ -n "${{ secrets.SSH_HOST }}" ]; then
            echo "Deploying via SSH remote runner..."
            # Remote docker compose pull and restart
            ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "cd ${{ secrets.SSH_DEPLOY_DIR:-/opt/smex-store }} && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d --remove-orphans"
          else
            echo "Notice: PRODUCTION_DEPLOY_WEBHOOK or SSH_HOST not configured. Container images published to GHCR. Manual deployment pull required on target host."
          fi

      - name: Verify Deployment Health Probe
        id: deploy_probe
        run: |
          TARGET_URL="${{ secrets.PRODUCTION_HEALTH_URL }}"
          MAX_ATTEMPTS=10
          INTERVAL=5
          DEPLOY_SUCCESS=false

          if [ -n "$TARGET_URL" ]; then
            echo "Starting health probe polling on $TARGET_URL (Max attempts: $MAX_ATTEMPTS, interval: ${INTERVAL}s)..."
            for i in $(seq 1 $MAX_ATTEMPTS); do
              echo "Probe attempt $i of $MAX_ATTEMPTS..."
              STATUS_CODE=$(curl -s -o /tmp/health_response.json -w "%{http_code}" "$TARGET_URL" || echo "000")
              if [ "$STATUS_CODE" -eq 200 ]; then
                if grep -q '"status":"ok"' /tmp/health_response.json; then
                  echo "Health probe passed with status 200 OK and healthy state."
                  DEPLOY_SUCCESS=true
                  break
                fi
              fi
              sleep $INTERVAL
            done
          else
            echo "PRODUCTION_HEALTH_URL not configured. Image publication complete."
            DEPLOY_SUCCESS=true
          fi

          if [ "$DEPLOY_SUCCESS" = "false" ]; then
            echo "HEALTH_CHECK_FAILED=true" >> "$GITHUB_OUTPUT"
            echo "Critical: Post-deployment health check failed after ${MAX_ATTEMPTS} attempts."
            exit 1
          else
            echo "HEALTH_CHECK_FAILED=false" >> "$GITHUB_OUTPUT"
            echo "Deployment successfully verified."
          fi

      - name: Automated Rollback on Health Probe Failure
        if: failure() && steps.trigger_deploy.outcome == 'success'
        run: |
          echo "::error title=Deployment Failed::Health check failed. Executing automated rollback..."
          if [ -n "${{ secrets.PRODUCTION_ROLLBACK_WEBHOOK }}" ]; then
            curl -s -X POST "${{ secrets.PRODUCTION_ROLLBACK_WEBHOOK }}" \
              -H "Content-Type: application/json" \
              -d '{"action":"rollback","reason":"health_check_failed"}'
            echo "Rollback webhook dispatched."
          elif [ -n "${{ secrets.SSH_HOST }}" ]; then
            ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "cd ${{ secrets.SSH_DEPLOY_DIR:-/opt/smex-store }} && docker compose -f docker-compose.prod.yml rollback || docker compose -f docker-compose.prod.yml down"
            echo "Remote rollback executed via SSH."
          else
            echo "Warning: Automated rollback handler requires PRODUCTION_ROLLBACK_WEBHOOK or SSH_HOST to be configured."
          fi
          exit 1
